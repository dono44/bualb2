workflows:
  android-apk:
    name: Android APK

    environment:
      node: 22
      java: 17

    scripts:
      - npm ci
      - npm run build
      - npx cap sync android

      - test -f android/gradlew
      - chmod +x android/gradlew
      - ./android/gradlew -p android assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk